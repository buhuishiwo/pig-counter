services:
  mysql:
    image: mysql:8.0
    container_name: pig-count-mysql
    ports:
      # 仅绑本机：不对外暴露 MySQL。需要外部连库时用 SSH 隧道：
      #   ssh -L 3307:127.0.0.1:3307 root@<server>
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=pig_counterMysql
      - MYSQL_DATABASE=pig_counter
      # 时区必须为 Asia/Shanghai：created_at 为 TIMESTAMP，NOW()/CURDATE() 依赖会话时区，
      # 默认 UTC 会导致页面时间早 8 小时、「今日」日界错到北京时间 08:00
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - pig-count-network

  backend:
    build: .
    container_name: pig-count-backend
    ports:
      # 仅绑本机：公网唯一入口是 nginx 的 8888。
      # nginx 通过 pig-count-network 访问 backend:8866，不依赖宿主端口，
      # 因此关掉对外映射不影响服务，同时避免绕过 nginx 直打无鉴权的推理接口。
      - "127.0.0.1:8866:8866"
    environment:
      - PIG_SERVICE_HOST=0.0.0.0
      - PIG_SERVICE_PORT=8866
      - PIG_MODEL_PATH=/app/model/pig_count.onnx
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=pig_counterMysql
      - DB_NAME=pig_counter
      - OCR_API_KEY=${OCR_API_KEY:-}
      - OCR_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - OCR_MODEL=qwen-vl-ocr
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - pig-count-network

  nginx:
    image: nginx:latest
    container_name: pig-count-nginx
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/usr/share/nginx/html   # Vue build 目录
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pig-count-network

networks:
  pig-count-network:
    driver: bridge

volumes:
  mysql_data: